name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 必需检查（分支保护）：离线 fixture 回归。
  # 测试对象是仓库内 tracked 的 dist/dynsnap.js（基线回归）；
  # 本次变更源码的产物回归在合并进 main 后由 build-and-test 完成。
  test:
    name: test (fixture)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DYN_SNAP_SKIP_REAL: '1'
          DYN_SNAP_BROWSER: /usr/bin/google-chrome

  # PR 必需检查（分支保护）+ main 合并态安全网：
  # 构建走 babel（只剥类型不校验），类型门禁是真正的语义门
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout host repo (Bilibili-Evolved)
        uses: actions/checkout@v4
        with:
          repository: the1812/Bilibili-Evolved
          ref: master
          path: host/Bilibili-Evolved
      - name: Link host repo to tsconfig expected path
        run: ln -s "$GITHUB_WORKSPACE/host/Bilibili-Evolved" "$GITHUB_WORKSPACE/../../Bilibili-Evolved"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        env:
          BILI_EVOLVED_PATH: ${{ github.workspace }}/host/Bilibili-Evolved

  # 合版后在主分支完成任务构建：BE 工具链构建 dist，并立即用新产物跑 fixture 回归
  build-and-test:
    name: build & test dist
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout host repo (Bilibili-Evolved)
        uses: actions/checkout@v4
        with:
          repository: the1812/Bilibili-Evolved
          ref: master
          path: host/Bilibili-Evolved
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-be-${{ runner.os }}-${{ hashFiles('host/Bilibili-Evolved/pnpm-lock.yaml', 'host/Bilibili-Evolved/registry/pnpm-lock.yaml') }}
          restore-keys: pnpm-be-${{ runner.os }}-
      - name: Install host dependencies
        run: |
          pnpm --dir host/Bilibili-Evolved install
          pnpm --dir host/Bilibili-Evolved/registry install
      - run: npm ci
      - name: Build dist/dynsnap.js
        run: node build.js
        env:
          BILI_EVOLVED_PATH: ${{ github.workspace }}/host/Bilibili-Evolved
      - name: Fixture tests against fresh dist
        run: npm test
        env:
          DYN_SNAP_SKIP_REAL: '1'
          DYN_SNAP_BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dynsnap.js
          path: dist/dynsnap.js
